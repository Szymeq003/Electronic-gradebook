<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytuj Ucznia - Admin</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <div class="container" style="padding: 3rem 0; max-width: 600px;">
        <a href="/admin/students" class="btn btn-ghost" style="margin-bottom: 2rem;">← Powrót do listy</a>

        <div class="card">
            <h1 style="margin-bottom: 0.5rem;">Edytuj Dane Ucznia</h1>
            <p class="text-muted mb-4">Modyfikacja profilu ucznia w systemie.</p>

            <form th:action="@{/admin/students/edit/{id}(id=${student.id})}" method="post" th:object="${student}">
                <div class="form-group">
                    <label>Imię</label>
                    <input type="text" class="input-control" th:field="*{firstName}" placeholder="Imię" required/>
                </div>
                <div class="form-group">
                    <label>Nazwisko</label>
                    <input type="text" class="input-control" th:field="*{lastName}" placeholder="Nazwisko" required/>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="input-control" th:field="*{email}" placeholder="email@szkola.pl" required/>
                </div>
                <div class="form-group">
                    <label>Przypisana Klasa</label>
                    <select class="input-control" th:field="*{schoolClass}">
                        <option value="">Wybierz klasę...</option>
                        <option th:each="c : ${schoolClasses}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Zapisz Zmiany</button>
            </form>

            <!-- Login info section -->
            <div th:if="${appUser}" style="margin-top: 1.5rem; padding: 1rem; background: var(--surface-2, #f8fafc); border-radius: 0.5rem; border: 1px solid var(--border);">
                <p style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 0.5rem;">Dane logowania</p>
                <p style="margin: 0;">Login: <strong th:text="${appUser.username}"></strong></p>
            </div>
        </div>
    </div>
</body>
