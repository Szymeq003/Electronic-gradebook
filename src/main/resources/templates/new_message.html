<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowa Wiadomość - Dzienniczek</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .recipient-badge {
            display: inline-flex;
            align-items: center;
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid #e5e7eb;
            user-select: none;
        }
        .recipient-badge .remove-recipient {
            margin-left: 0.5rem;
            cursor: pointer;
            color: #9ca3af;
            font-weight: bold;
            border: none;
            background: none;
            padding: 0;
            font-size: 1.125rem;
            line-height: 1;
        }
        .recipient-badge .remove-recipient:hover {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo">
            <span>Dzienniczek</span>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a th:href="${dashboardUrl}">Panel główny</a></li>
                <li><a th:href="@{/messages}">Odebrane</a></li>
                <li><a th:href="@{/messages/sent}">Wysłane</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <div class="header" style="margin-bottom: 2rem;">
            <h1>Nowa Wiadomość</h1>
            <p class="text-muted">Wybierz odbiorcę i napisz treść.</p>
        </div>

        <div class="card compose-card">
            <div th:if="${errors}" class="alert alert-danger" style="margin-bottom: 1.5rem; padding: 1rem; background: #fee2e2; border: 1px solid #ef4444; border-radius: 0.5rem; color: #b91c1c;">
                <ul style="margin: 0; padding-left: 1.5rem;">
                    <li th:each="error : ${errors}" th:text="${error.defaultMessage}"></li>
                </ul>
            </div>
            <form th:action="@{/messages/send}" method="post">
                <div class="form-group recipient-search-group">
                    <label for="recipientSearch">Odbiorca</label>

                    <!-- pole wyszukiwania widoczne dla użytkownika -->
                    <input
                        type="text"
                        id="recipientSearch"
                        class="input-control"
                        placeholder="Wpisz imię, nazwisko lub rolę..."
                        autocomplete="off"
                    />

                    <!-- kontener na wybranych odbiorców (tagi) -->
                    <div id="selectedRecipientsList" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; margin-bottom: 0.5rem;"></div>

                    <!-- lista wyników -->
                    <div id="recipientDropdown" class="recipient-dropdown" style="display:none;"></div>

                    <!-- komunikat walidacji -->
                    <span id="recipientError" class="recipient-error" style="display:none;">
                        Wybierz co najmniej jednego adresata z listy.
                    </span>

                    <!-- dane odbiorców zakodowane jako JSON w data-attribute -->
                    <div id="recipientsData"
                         th:attr="data-recipients=${recipientsJson}"
                         style="display:none;">
                    </div>
                </div>

                <div class="form-group">
                    <label for="subject">Temat</label>
                    <input type="text" name="subject" id="subject" class="input-control" placeholder="Temat wiadomości..." required>
                </div>

                <div class="form-group">
                    <label for="content">Treść</label>
                    <textarea name="content" id="content" class="input-control textarea-dynamic" placeholder="Napisz swoją wiadomość..." required></textarea>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <a th:href="@{/messages}" class="btn btn-ghost">Anuluj</a>
                    <button type="submit" class="btn btn-primary">Wyślij wiadomość</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // Auto-resize textarea logic
        const textarea = document.getElementById('content');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Allow Shift+Enter for new line, but track height
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                // Regular enter will grow the area via 'input' event
            }
        });

        // Recipient search autocomplete logic
        (function () {
            const searchInput   = document.getElementById('recipientSearch');
            const dropdown      = document.getElementById('recipientDropdown');
            const errorSpan     = document.getElementById('recipientError');
            const dataDiv       = document.getElementById('recipientsData');
            const selectedList  = document.getElementById('selectedRecipientsList');
            const form          = document.querySelector('form');

            // Parsuj dane z data-attribute
            const recipients = JSON.parse(dataDiv.dataset.recipients || '[]');
            const selectedIds = new Set();

            function buildLabel(r) {
                let label = r.name + ' — ' + r.role;
                if (r.klasa) label += ' [' + r.klasa + ']';
                if (r.email) label += ' (' + r.email + ')';
                return label;
            }

            function updateHiddenInputs() {
                // Usuń stare ukryte inputy z tą samą nazwą
                const existingInputs = form.querySelectorAll('input[name="recipientIds"]');
                existingInputs.forEach(input => input.remove());

                // Stwórz nowe ukryte inputy dla każdego wybranego odbiorcy
                selectedIds.forEach(id => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'recipientIds';
                    input.value = id;
                    form.appendChild(input);
                });
            }

            function addRecipient(r) {
                if (selectedIds.has(r.id)) {
                    return; // Adresat już dodany
                }
                selectedIds.add(r.id);

                const badge = document.createElement('div');
                badge.className = 'recipient-badge';
                badge.id = 'badge-' + r.id;

                const textSpan = document.createElement('span');
                textSpan.textContent = r.name + ' (' + r.role + ')';
                badge.appendChild(textSpan);

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'remove-recipient';
                removeBtn.innerHTML = '&times;';
                removeBtn.addEventListener('click', () => {
                    removeRecipient(r.id);
                });
                badge.appendChild(removeBtn);

                selectedList.appendChild(badge);
                updateHiddenInputs();

                searchInput.value = '';
                dropdown.style.display = 'none';
                errorSpan.style.display = 'none';
            }

            function removeRecipient(id) {
                selectedIds.delete(id);
                const badge = document.getElementById('badge-' + id);
                if (badge) {
                    badge.remove();
                }
                updateHiddenInputs();
            }

            function renderDropdown(filtered) {
                dropdown.innerHTML = '';
                // Filtrujemy te, które są już wybrane
                const nonSelected = filtered.filter(r => !selectedIds.has(r.id));

                if (nonSelected.length === 0) {
                    dropdown.innerHTML = '<div class="recipient-no-results">Brak wyników lub wszyscy już dodani</div>';
                } else {
                    nonSelected.forEach(r => {
                        const item = document.createElement('div');
                        item.className = 'recipient-item';
                        item.textContent = buildLabel(r);
                        item.dataset.id = r.id;
                        item.addEventListener('mousedown', () => {
                            addRecipient(r);
                        });
                        dropdown.appendChild(item);
                    });
                }
                dropdown.style.display = 'block';
            }

            searchInput.addEventListener('input', function () {
                const q = this.value.trim().toLowerCase();
                if (q.length < 1) {
                    dropdown.style.display = 'none';
                    return;
                }
                const filtered = recipients.filter(r =>
                    r.name.toLowerCase().includes(q)  ||
                    r.role.toLowerCase().includes(q)  ||
                    r.email.toLowerCase().includes(q) ||
                    r.klasa.toLowerCase().includes(q)
                );
                renderDropdown(filtered);
            });

            searchInput.addEventListener('focus', function () {
                if (this.value.trim().length > 0) {
                    const q = this.value.trim().toLowerCase();
                    renderDropdown(
                        recipients.filter(r =>
                            r.name.toLowerCase().includes(q)  ||
                            r.role.toLowerCase().includes(q)  ||
                            r.email.toLowerCase().includes(q) ||
                            r.klasa.toLowerCase().includes(q)
                        )
                    );
                }
            });

            document.addEventListener('click', function (e) {
                if (!e.target.closest('.recipient-search-group')) {
                    dropdown.style.display = 'none';
                }
            });

            // Walidacja przy wysyłaniu formularza
            form.addEventListener('submit', function (e) {
                if (selectedIds.size === 0) {
                    e.preventDefault();
                    errorSpan.style.display = 'block';
                    searchInput.focus();
                }
            });
        })();
    </script>

</body>
</html>
