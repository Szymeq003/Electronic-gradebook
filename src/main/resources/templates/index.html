<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nauczyciele - Zarządzanie</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <div class="container" style="padding: 3rem 0;">
        <a th:href="${backUrl}" class="btn btn-ghost" style="margin-bottom: 2rem;" th:text="${backText}">← Powrót do panelu admina</a>

        <div class="header" style="margin-bottom: 3rem; display: flex; justify-content: space-between; align-items: start;">
            <div>
                <h1>Zarządzanie Nauczycielami</h1>
                <p class="text-muted">Rejestr kadry pedagogicznej.</p>
            </div>
            <a href="/admin/teachers/add" class="btn btn-primary">+ Dodaj Nauczyciela</a>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Lp.</th>
                        <th>Imię i Nazwisko</th>
                        <th>Email</th>
                        <th>Akcje</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t, iter : ${teachers}">
                        <td th:text="${iter.count}"></td>
                        <td style="font-weight: 700;" th:text="${t.lastName} + ' ' + ${t.firstName}"></td>
                        <td th:text="${t.email}" class="text-muted"></td>
                        <td>
                            <div style="display: flex; gap: 0.5rem;">
                                <a th:href="@{/admin/teachers/edit/{id}(id=${t.id})}" class="btn btn-ghost" style="padding: 0.4rem 0.8rem;">Edytuj</a>
                                <a th:href="@{/admin/teachers/delete/{id}(id=${t.id})}" class="btn btn-danger" style="padding: 0.4rem 0.8rem;"
                                    onclick="return confirm('Spowoduje to bezpowrotne usunięcie nauczyciela. Czy jesteś pewny?');">Usuń</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
