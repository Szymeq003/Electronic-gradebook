<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Edytuj Ocenę</title>
</head>

<body>

    <nav>
        <a th:href="@{/teachers}">Nauczyciele</a> | 
        <a th:href="@{/students}">Uczniowie</a> | 
        <a th:href="@{/students/add}">Dodaj Ucznia</a> | 
        <a th:href="@{/classes}">Klasy</a>
    </nav>
    <hr />

    <div sec:authorize="hasAnyRole('ADMIN', 'DIRECTOR')"
         th:if="${grade.createdAt != null}"
         style="margin-bottom: 1.5rem; padding: 1rem 1.25rem;
                background: #fefce8; border: 1px solid #fde047;
                border-radius: 8px; color: #854d0e; font-size: 0.88rem; max-width: 600px;">
        ⚠️ Edytujesz ocenę jako administrator. Ocena została wystawiona
        <strong th:text="${#temporals.format(grade.createdAt, 'd MMM yyyy, HH:mm')}"></strong>.
        Zmiany są logowane.
    </div>

    <h1 th:text="|Edytuj Ocenę z przedmiotu: ${grade.subject.name}|">Edytuj Ocenę</h1>

    <form th:action="@{/grades/edit/{id}(id=${grade.id})}" method="post" th:object="${grade}">
        
        <label>Ocena: 
                <select th:field="*{value}" required>
                    <option value="1">1</option>
                    <option value="1+">1+</option>
                    <option value="2-">2-</option>
                    <option value="2">2</option>
                    <option value="2+">2+</option>
                    <option value="3-">3-</option>
                    <option value="3">3</option>
                    <option value="3+">3+</option>
                    <option value="4-">4-</option>
                    <option value="4">4</option>
                    <option value="4+">4+</option>
                    <option value="5-">5-</option>
                    <option value="5">5</option>
                    <option value="5+">5+</option>
                    <option value="6-">6-</option>
                    <option value="6">6</option>
                </select>
        </label><br /><br />
        
        <label>Data wystawienia: 
            <input type="date" th:field="*{date}" required />
        </label><br /><br />
        
        <button type="submit">Zapisz Zmiany</button>
    </form>

    <br />
    <a th:href="@{/grades/student/{studentId}/subject/{subjectId}(studentId=${grade.student.id}, subjectId=${grade.subject.id})}">Powrót do listy ocen</a>

</body>

</html>
